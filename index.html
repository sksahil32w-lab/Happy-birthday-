<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- Fullscreen & PWA Meta Tags for iOS/Android -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#010204">

    <title>Cinematic Intro</title>
    
    <style>
        :root {
            --primary-glow: #00f3ff;
            --secondary-glow: #0088ff;
            --bg-color: #010204;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100dvh; /* Adapts to mobile browser UI */
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none; /* Prevent bounce scroll */
            touch-action: none; /* Strict touch prevention */
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: translateZ(0); /* Hardware acceleration */
        }

        #app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transform-origin: center center;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Initial Fullscreen Activation Gate */
        #enter-fullscreen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(1, 2, 4, 0.92);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease;
        }

        .enter-btn {
            padding: 16px 45px;
            font-size: 4.5vmin;
            font-weight: 700;
            color: #ffffff;
            background: rgba(0, 136, 255, 0.15);
            border: 2px solid var(--primary-glow);
            border-radius: 50px;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5), inset 0 0 15px rgba(0, 243, 255, 0.2);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            animation: pulseButton 2s infinite ease-in-out;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .enter-btn:active {
            transform: scale(0.95);
            background: rgba(0, 136, 255, 0.35);
        }

        .countdown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 25vmin; /* Scales with screen size */
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            text-shadow: 0 0 20px var(--primary-glow);
            letter-spacing: 2px;
            will-change: transform, opacity, filter;
            margin: 0;
            padding: 0;
            line-height: 1;
        }

        .lets-go-text {
            position: absolute;
            top: 45%;
            left: 50%;
            font-size: 20vmin;
            font-weight: 900;
            color: #ffffff;
            opacity: 0;
            text-shadow: 0 0 30px #ffffff, 0 0 60px var(--primary-glow);
            white-space: nowrap;
            letter-spacing: 5px;
            will-change: transform, opacity, filter;
            margin: 0;
            padding: 0;
            line-height: 1;
        }

        .continue-btn {
            position: absolute;
            bottom: calc(15% + env(safe-area-inset-bottom)); /* Safe area for iPhone home bar */
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 40px;
            font-size: 4vmin;
            font-weight: 700;
            color: #ffffff;
            background: rgba(0, 136, 255, 0.1);
            border: 2px solid var(--primary-glow);
            border-radius: 50px;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.2s ease, background 0.2s ease;
            animation: pulseButton 2s infinite ease-in-out;
            will-change: transform, opacity;
            z-index: 20;
            font-family: inherit;
        }

        .continue-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .continue-btn:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(0, 136, 255, 0.3);
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            will-change: opacity;
        }

        #fade-overlay.active {
            opacity: 1;
        }

        #rotate-guard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #020305;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .phone-icon {
            width: 50px;
            height: 85px;
            border: 3px solid #ffffff;
            border-radius: 8px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #ffffff;
        }

        .rotate-text {
            margin-top: 25px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--primary-glow);
        }

        @media (orientation: portrait) {
            #rotate-guard { display: flex; }
            #app-container { display: none; }
            #enter-fullscreen-overlay { display: none !important; }
        }
        @media (orientation: landscape) {
            #rotate-guard { display: none; }
            #app-container { display: block; }
        }

        @keyframes cinematicNumber {
            0% { transform: translate(-50%, -50%) scale(3) translateZ(0); filter: blur(15px); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1) translateZ(0); filter: blur(0px); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(0.9) translateZ(0); filter: blur(0px); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5) translateZ(0); filter: blur(10px); opacity: 0; }
        }

        @keyframes letsGoReveal {
            0% { transform: translate(-50%, -50%) scale(0.5) translateZ(0); filter: blur(15px); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.1) translateZ(0); filter: blur(0px); opacity: 1; text-shadow: 0 0 40px #fff, 0 0 80px var(--primary-glow); }
            100% { transform: translate(-50%, -50%) scale(1) translateZ(0); opacity: 1; text-shadow: 0 0 20px #fff, 0 0 40px var(--primary-glow); }
        }

        @keyframes pulseButton {
            0% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2); }
            50% { box-shadow: 0 0 25px rgba(0, 243, 255, 0.8), inset 0 0 15px rgba(0, 243, 255, 0.4); }
            100% { box-shadow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2); }
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }
    </style>
</head>
<body>

    <!-- Portrait Orientation Guard -->
    <div id="rotate-guard">
        <div class="phone-icon"></div>
        <div class="rotate-text">Rotate Device</div>
    </div>

    <!-- Initial Fullscreen Activation Overlay -->
    <div id="enter-fullscreen-overlay">
        <button id="start-btn" class="enter-btn">Tap to Start ✨</button>
    </div>

    <!-- Main Experience Container -->
    <div id="app-container">
        <!-- High Performance Canvas -->
        <canvas id="particle-canvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer">
            <div id="text-3" class="countdown-text">3</div>
            <div id="text-2" class="countdown-text">2</div>
            <div id="text-1" class="countdown-text">1</div>
            <div id="text-lets-go" class="lets-go-text">LET'S GO</div>
            <button id="continue-btn" class="continue-btn">Continue ✨</button>
        </div>

        <div id="fade-overlay"></div>
    </div>

    <script>
        const CONFIG = {
            nextPageUrl: 'index2.html',
            numberDuration: 1200,    
            letsGoDuration: 2500,    
            characters: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZアイウエオカキクケコサシスセソタチツテトナニヌネノ".split(''),
        };

        // Mobile touch prevention (stops bounce/pull-to-refresh entirely)
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });

        let isStarted = false;
        let animationFrameId;
        let isHyperdrive = false;

        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimize for no transparency behind canvas

        // Batched Rendering Layers (Drastically reduces Canvas state changes)
        const LAYERS = [
            { size: 10, color: '#004488', speedMult: 0.8, alpha: 0.3, count: 0 }, // Back (Dark, small, slow)
            { size: 16, color: '#00aaff', speedMult: 1.5, alpha: 0.6, count: 0 }, // Mid (Cyan, medium)
            { size: 24, color: '#ffffff', speedMult: 2.5, alpha: 0.9, count: 0 }  // Front (White, large, fast)
        ];

        let batchedParticles = [[], [], []];
        let dpr = 1;

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            ctx.scale(dpr, dpr);

            const totalParticles = Math.min(Math.floor(window.innerWidth / 3), 400);
            LAYERS[0].count = Math.floor(totalParticles * 0.50);
            LAYERS[1].count = Math.floor(totalParticles * 0.35);
            LAYERS[2].count = Math.floor(totalParticles * 0.15);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MobileOptimizedParticle {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                this.x = Math.random() * window.innerWidth;
                this.y = randomY ? Math.random() * window.innerHeight : (Math.random() * -100 - 50);
                this.char = CONFIG.characters[Math.floor(Math.random() * CONFIG.characters.length)];
                this.flickerDelay = Math.floor(Math.random() * 60) + 30; 
                this.frames = 0;
                this.vx = 0;
                this.vy = 0;
            }

            update(baseSpeed) {
                if (isHyperdrive) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.94; // Drag
                    this.vy *= 0.94;
                    
                    if (this.x < -100 || this.x > window.innerWidth + 100 || 
                        this.y < -100 || this.y > window.innerHeight + 100) {
                        this.reset();
                    }
                } else {
                    this.y += baseSpeed;
                    if (this.y > window.innerHeight + 50) {
                        this.reset();
                    }
                    this.frames++;
                    if (this.frames > this.flickerDelay) {
                        this.char = CONFIG.characters[Math.floor(Math.random() * CONFIG.characters.length)];
                        this.frames = 0;
                    }
                }
            }
        }

        function initParticles() {
            batchedParticles = [[], [], []];
            for (let i = 0; i < LAYERS.length; i++) {
                for (let j = 0; j < LAYERS[i].count; j++) {
                    batchedParticles[i].push(new MobileOptimizedParticle());
                }
            }
        }

        function triggerBurst() {
            isHyperdrive = true;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < batchedParticles.length; i++) {
                for (let j = 0; j < batchedParticles[i].length; j++) {
                    const p = batchedParticles[i][j];
                    const dx = p.x - centerX;
                    const dy = p.y - centerY;
                    const distance = Math.sqrt(dx*dx + dy*dy) || 1;
                    
                    const force = (Math.random() * 35 + 15) / (distance * 0.02 + 1);
                    p.vx = (dx / distance) * force;
                    p.vy = (dy / distance) * force;
                }
            }
        }

        function animateCanvas() {
            ctx.fillStyle = isHyperdrive ? 'rgba(3, 5, 8, 0.1)' : 'rgba(1, 2, 4, 0.3)';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
            
            for (let i = 0; i < LAYERS.length; i++) {
                const layer = LAYERS[i];
                const particles = batchedParticles[i];
                
                ctx.font = `bold ${layer.size}px monospace`;
                ctx.fillStyle = isHyperdrive ? '#ffffff' : layer.color;
                ctx.globalAlpha = isHyperdrive ? 1.0 : layer.alpha;
                
                for (let j = 0; j < particles.length; j++) {
                    const p = particles[j];
                    p.update(layer.speedMult);
                    ctx.fillText(p.char, p.x, p.y);
                }
            }
            
            animationFrameId = requestAnimationFrame(animateCanvas);
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function playSequence() {
            isStarted = true;
            
            const el3 = document.getElementById('text-3');
            const el2 = document.getElementById('text-2');
            const el1 = document.getElementById('text-1');
            const elLetsGo = document.getElementById('text-lets-go');
            const btnContinue = document.getElementById('continue-btn');

            await sleep(400);

            el3.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration);
            el3.style.display = 'none';

            el2.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration);
            el2.style.display = 'none';

            el1.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration - 150); 
            
            triggerBurst();
            el1.style.display = 'none';
            await sleep(150);

            elLetsGo.style.animation = `letsGoReveal 1.5s forwards ease-out`;
            await sleep(1500); 

            btnContinue.classList.add('visible');
        }

        document.getElementById('continue-btn').addEventListener('click', async (e) => {
            const fade = document.getElementById('fade-overlay');
            const container = document.getElementById('app-container');
            
            e.target.style.pointerEvents = 'none';
            
            container.style.transition = 'transform 1s cubic-bezier(0.25, 1, 0.5, 1)';
            container.style.transform = 'scale(1.5)';
            fade.classList.add('active');
            
            await sleep(1000); 

            cancelAnimationFrame(animationFrameId);
            window.location.href = CONFIG.nextPageUrl;
        });

        // Trigger Fullscreen & Start Animation upon user tap
        document.getElementById('start-btn').addEventListener('click', () => {
            const overlay = document.getElementById('enter-fullscreen-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);

            // Request browser fullscreen API if supported
            const docEl = document.documentElement;
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(() => {});
            } else if (docEl.webkitRequestFullscreen) {
                docEl.webkitRequestFullscreen();
            }

            if (window.innerWidth > window.innerHeight && !isStarted) {
                initParticles();
                animateCanvas();
                playSequence();
            }
        });

        window.addEventListener('load', () => {
            window.matchMedia("(orientation: landscape)").addEventListener("change", (e) => {
                if (e.matches && isStarted) {
                    // resumes nicely if rotated
                }
            });
        });

    </script>
</body>
</html>
