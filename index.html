<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Extremely strict viewport to prevent any zooming or scaling on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cinematic Intro</title>
    
    <style>
        :root {
            --primary-glow: #ff4d79;   
            --secondary-glow: #ff99bb; 
            --bg-color: #1a050c;       
            --heart-glow: rgba(255, 77, 121, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Georgia', 'Times New Roman', serif;
            overscroll-behavior: none; 
            touch-action: none; 
            /* Force fast text rendering on mobile DOM */
            text-rendering: optimizeSpeed; 
            -webkit-font-smoothing: antialiased;
        }

        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 1;
            /* Strict GPU Acceleration */
            transform: translateZ(0); 
            -webkit-transform: translateZ(0);
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            transform-origin: center center;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            z-index: 10;
            pointer-events: none;
        }

        .countdown-text {
            position: absolute;
            top: 50%;
            left: 50%;
            font-size: 28vmin; 
            font-weight: normal;
            font-style: italic;
            color: #fff0f5;
            opacity: 0;
            text-shadow: 0 0 20px var(--primary-glow), 0 0 40px var(--secondary-glow);
            letter-spacing: 2px;
            /* Force strict mobile GPU layering to prevent frame drops */
            will-change: transform, opacity, filter;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform-style: preserve-3d;
            transform-style: preserve-3d;
        }

        .lets-go-text {
            position: absolute;
            top: 40%;
            left: 50%;
            font-size: 16vmin;
            font-weight: bold;
            color: #ffffff;
            opacity: 0;
            text-shadow: 0 0 30px #ffffff, 0 0 60px var(--primary-glow), 0 0 100px var(--secondary-glow);
            white-space: nowrap;
            letter-spacing: 8px;
            text-align: center;
            will-change: transform, opacity, filter;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .continue-btn {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 40px;
            font-size: 4.5vmin;
            font-weight: normal;
            color: #ffffff;
            background: rgba(255, 77, 121, 0.15);
            border: 2px solid var(--primary-glow);
            border-radius: 50px;
            box-shadow: 0 0 20px var(--heart-glow), inset 0 0 15px var(--heart-glow);
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.2s ease, background 0.2s ease;
            animation: pulseButton 2.5s infinite ease-in-out;
            z-index: 20;
            font-family: inherit;
            letter-spacing: 2px;
            will-change: transform, opacity;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .continue-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .continue-btn:active {
            transform: translateX(-50%) scale(0.95);
            background: rgba(255, 77, 121, 0.35);
        }

        #fade-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: #000000;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
            will-change: opacity;
            transform: translateZ(0);
        }

        #fade-overlay.active {
            opacity: 1;
        }

        #rotate-guard {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100dvh;
            background-color: var(--bg-color);
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        .phone-icon {
            width: 50px;
            height: 85px;
            border: 3px solid #ffb3c6;
            border-radius: 8px;
            position: relative;
            animation: rotatePhone 2s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255, 77, 121, 0.4);
        }

        .phone-icon::after {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid #ffb3c6;
        }

        .rotate-text {
            margin-top: 25px;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: normal;
            color: var(--secondary-glow);
            font-family: sans-serif;
        }

        @media (orientation: portrait) {
            #rotate-guard { display: flex; }
            #app-container { display: none; }
        }
        @media (orientation: landscape) {
            #rotate-guard { display: none; }
            #app-container { display: block; }
        }

        @keyframes cinematicNumber {
            0% { transform: translate(-50%, -50%) scale(3) translateZ(0); filter: blur(20px); opacity: 0; }
            20% { transform: translate(-50%, -50%) scale(1) translateZ(0); filter: blur(0px); opacity: 1; }
            80% { transform: translate(-50%, -50%) scale(0.9) translateZ(0); filter: blur(0px); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.5) translateZ(0); filter: blur(15px); opacity: 0; }
        }

        @keyframes letsGoReveal {
            0% { transform: translate(-50%, -50%) scale(0.6) translateZ(0); filter: blur(15px); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.05) translateZ(0); filter: blur(0px); opacity: 1; text-shadow: 0 0 50px #fff, 0 0 100px var(--primary-glow); }
            100% { transform: translate(-50%, -50%) scale(1) translateZ(0); opacity: 1; text-shadow: 0 0 30px #fff, 0 0 60px var(--primary-glow); }
        }

        @keyframes pulseButton {
            0% { box-shadow: 0 0 20px var(--heart-glow), inset 0 0 15px var(--heart-glow); }
            50% { box-shadow: 0 0 35px rgba(255, 77, 121, 0.9), inset 0 0 25px rgba(255, 77, 121, 0.6); }
            100% { box-shadow: 0 0 20px var(--heart-glow), inset 0 0 15px var(--heart-glow); }
        }

        @keyframes rotatePhone {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(-90deg); }
            100% { transform: rotate(-90deg); }
        }

        .fullscreen-entry-container {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            background-color: var(--bg-color);
            transition: opacity 0.8s ease, transform 0.8s ease;
            will-change: opacity, transform;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .fullscreen-entry-container.hidden {
            opacity: 0;
            transform: scale(1.1);
            pointer-events: none;
        }

        .orb-button {
            position: relative;
            width: 140px;
            height: 140px;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        .orb-core {
            position: relative;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,77,121,0.2) 0%, rgba(255,77,121,0.05) 100%);
            border: 2px solid var(--primary-glow);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px var(--heart-glow), inset 0 0 20px var(--heart-glow);
            z-index: 2;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s ease;
            animation: breathCore 2s infinite ease-in-out;
            transform: translateZ(0);
        }

        .orb-icon {
            width: 36px;
            height: 36px;
            color: #ffb3c6;
            filter: drop-shadow(0 0 12px var(--primary-glow));
            transition: transform 0.3s ease;
            animation: heartbeat 1.5s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
            60% { transform: scale(1); }
        }

        .orb-ring {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 1;
            pointer-events: none;
        }

        .ring-1 {
            width: 110px; height: 110px;
            border: 3px dashed var(--primary-glow);
            opacity: 0.7;
            box-shadow: 0 0 15px var(--primary-glow);
            animation: spinRing 6s linear infinite;
        }

        .ring-2 {
            width: 140px; height: 140px;
            border: 2px dotted var(--secondary-glow);
            opacity: 0.5;
            box-shadow: 0 0 20px var(--secondary-glow);
            animation: spinRing reverse 8s linear infinite;
        }

        .orb-text {
            margin-top: 40px;
            color: #ffb3c6;
            font-size: 1.1rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-style: italic;
            opacity: 0.8;
            animation: breathText 3s infinite ease-in-out;
            text-shadow: 0 0 15px var(--primary-glow);
            font-family: inherit;
        }

        .orb-button:active .orb-core {
            transform: scale(0.85) translateZ(0);
            background: rgba(255, 77, 121, 0.3);
            box-shadow: 0 0 40px rgba(255, 77, 121, 0.8), inset 0 0 30px rgba(255, 77, 121, 0.7);
        }

        @keyframes spinRing {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes breathCore {
            0%, 100% { box-shadow: 0 0 25px var(--heart-glow), inset 0 0 15px var(--heart-glow); }
            50% { box-shadow: 0 0 45px rgba(255, 77, 121, 0.9), inset 0 0 30px rgba(255, 77, 121, 0.7); }
        }

        @keyframes breathText {
            0%, 100% { opacity: 0.6; text-shadow: 0 0 8px rgba(255, 77, 121, 0.5); }
            50% { opacity: 1; text-shadow: 0 0 20px var(--primary-glow); }
        }
    </style>
</head>
<body>
    <!-- Portrait Orientation Guard -->
    <div id="rotate-guard">
        <div class="phone-icon"></div>
        <div class="rotate-text">Rotate Device</div>
    </div>

    <!-- Main Experience Container -->
    <div id="app-container">
        
        <!-- Fullscreen Entry Layer (The Glowing Heart Gateway) -->
        <div id="fullscreen-entry" class="fullscreen-entry-container">
            <button id="orb-btn" class="orb-button">
                <div class="orb-ring ring-1"></div>
                <div class="orb-ring ring-2"></div>
                <div class="orb-core">
                    <!-- Romantic Heart SVG Icon -->
                    <svg class="orb-icon" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </div>
            </button>
            <div class="orb-text">Touch the Heart</div>
        </div>

        <!-- High Performance Canvas -->
        <canvas id="particle-canvas"></canvas>

        <!-- UI Layer for Countdown and Continue -->
        <div id="ui-layer">
            <div id="text-3" class="countdown-text">3</div>
            <div id="text-2" class="countdown-text">2</div>
            <div id="text-1" class="countdown-text">1</div>
            <div id="text-lets-go" class="lets-go-text">HAPPY BIRTHDAY</div>
            <button id="continue-btn" class="continue-btn">Enter My Heart 💖</button>
        </div>

        <div id="fade-overlay"></div>
        
        <!-- Background Music -->
        <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
    </div>

    <script>
        const CONFIG = {
            nextPageUrl: 'index2.html',
            numberDuration: 1200,    
            letsGoDuration: 2500,    
            characters: ['❤️', '💕', '💗', '✨', '🌸', '💖', '🤍'],
        };
        
        // Cache character length for O(1) loop lookups instead of property access
        const CHAR_LEN = CONFIG.characters.length;

        // Strict Mobile touch prevention 
        document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });
        document.addEventListener('dblclick', (e) => { e.preventDefault(); }, { passive: false });

        let isStarted = false;
        let animationFrameId;
        let isHyperdrive = false;

        const canvas = document.getElementById('particle-canvas');
        // Hardware acceleration hints: alpha false ensures no transparent blending with DOM behind it
        const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true }); 
        const appContainer = document.getElementById('app-container');

        // Batched Rendering Layers
        const LAYERS = [
            { size: 14, color: '#ff99bb', speedMult: 0.6, alpha: 0.4, count: 0, fontStr: '' },
            { size: 22, color: '#ff4d79', speedMult: 1.2, alpha: 0.7, count: 0, fontStr: '' },
            { size: 34, color: '#ffffff', speedMult: 2.0, alpha: 1.0, count: 0, fontStr: '' }
        ];

        let batchedParticles = [[], [], []];
        let dpr = 1;
        
        // **MOBILE OPTIMIZATION**: Cache viewport dimensions to prevent DOM layout thrashing in animation loop
        let cw = window.innerWidth;
        let ch = window.innerHeight;

        function resizeCanvas() {
            // Cap DPR to avoid overwhelming mobile GPUs
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            cw = window.innerWidth;
            ch = window.innerHeight;
            
            canvas.width = cw * dpr;
            canvas.height = ch * dpr;
            
            canvas.style.width = cw + 'px';
            canvas.style.height = ch + 'px';
            
            ctx.scale(dpr, dpr);

            // Dynamically adjust particle count based on screen width
            const totalParticles = Math.min(Math.floor(cw / 3), 400);
            
            // Distribution and Pre-calculated strings for the render loop
            LAYERS[0].count = Math.floor(totalParticles * 0.50);
            LAYERS[0].fontStr = `normal ${LAYERS[0].size}px sans-serif`;
            
            LAYERS[1].count = Math.floor(totalParticles * 0.35);
            LAYERS[1].fontStr = `normal ${LAYERS[1].size}px sans-serif`;
            
            LAYERS[2].count = Math.floor(totalParticles * 0.15);
            LAYERS[2].fontStr = `normal ${LAYERS[2].size}px sans-serif`;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class MobileOptimizedParticle {
            constructor() {
                this.reset(true);
            }

            reset(randomY = false) {
                // Use cached cw/ch directly
                this.x = Math.random() * cw;
                this.y = randomY ? Math.random() * ch : (Math.random() * -100 - 50);
                
                this.char = CONFIG.characters[Math.floor(Math.random() * CHAR_LEN)];
                this.flickerDelay = Math.floor(Math.random() * 60) + 30; 
                this.frames = 0;
                
                this.vx = 0;
                this.vy = 0;
            }

            update(baseSpeed) {
                this.frames++;
                
                if (isHyperdrive) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vx *= 0.92; 
                    this.vy *= 0.92;
                    
                    this.y -= 1.5; 
                    this.x += Math.sin(this.frames * 0.05) * 0.6;
                    
                    if (this.x < -100 || this.x > cw + 100 || 
                        this.y < -100 || this.y > ch + 100) {
                        this.reset();
                    }
                } else {
                    this.y += baseSpeed;
                    if (this.y > ch + 50) {
                        this.reset();
                    }
                    
                    if (this.frames > this.flickerDelay) {
                        this.char = CONFIG.characters[Math.floor(Math.random() * CHAR_LEN)];
                        this.frames = 0;
                    }
                }
            }
        }

        function initParticles() {
            batchedParticles = [[], [], []];
            const layersLen = LAYERS.length;
            for (let i = 0; i < layersLen; i++) {
                const count = LAYERS[i].count;
                for (let j = 0; j < count; j++) {
                    batchedParticles[i].push(new MobileOptimizedParticle());
                }
            }
        }

        function triggerBurst() {
            isHyperdrive = true;
            const centerX = cw / 2;
            const centerY = ch / 2;
            
            const layersLen = batchedParticles.length;
            for (let i = 0; i < layersLen; i++) {
                const particles = batchedParticles[i];
                const pLen = particles.length;
                
                for (let j = 0; j < pLen; j++) {
                    const p = particles[j];
                    const dx = p.x - centerX;
                    const dy = p.y - centerY;
                    const distance = Math.sqrt(dx*dx + dy*dy) || 1;
                    
                    const force = (Math.random() * 25 + 10) / (distance * 0.02 + 1);
                    p.vx = (dx / distance) * force;
                    p.vy = (dy / distance) * force;
                }
            }
        }

        function animateCanvas() {
            // **MOBILE OPTIMIZATION**: Use cached dimensions. Fast fill.
            ctx.fillStyle = isHyperdrive ? 'rgba(42, 8, 19, 0.15)' : 'rgba(26, 5, 12, 0.3)';
            ctx.fillRect(0, 0, cw, ch);
            
            const layersLen = LAYERS.length;
            
            for (let i = 0; i < layersLen; i++) {
                const layer = LAYERS[i];
                const particles = batchedParticles[i];
                const pLen = particles.length; // Cache length to prevent property lookup
                
                // **MOBILE OPTIMIZATION**: Use pre-computed font strings
                ctx.font = layer.fontStr;
                ctx.fillStyle = isHyperdrive ? '#ffffff' : layer.color;
                ctx.globalAlpha = isHyperdrive ? 1.0 : layer.alpha;
                
                for (let j = 0; j < pLen; j++) {
                    const p = particles[j];
                    p.update(layer.speedMult);
                    ctx.fillText(p.char, p.x, p.y);
                }
            }
            
            animationFrameId = requestAnimationFrame(animateCanvas);
        }

        const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        async function playSequence() {
            isStarted = true;
            
            const el3 = document.getElementById('text-3');
            const el2 = document.getElementById('text-2');
            const el1 = document.getElementById('text-1');
            const elLetsGo = document.getElementById('text-lets-go');
            const btnContinue = document.getElementById('continue-btn');

            await sleep(400);

            el3.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration);
            el3.style.display = 'none';

            el2.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration);
            el2.style.display = 'none';

            el1.style.animation = `cinematicNumber ${CONFIG.numberDuration}ms forwards ease-in-out`;
            await sleep(CONFIG.numberDuration - 150); 
            
            triggerBurst();
            el1.style.display = 'none';
            await sleep(150);

            elLetsGo.style.animation = `letsGoReveal 1.5s forwards ease-out`;
            await sleep(1500); 

            btnContinue.classList.add('visible');
        }

        document.getElementById('continue-btn').addEventListener('click', async (e) => {
            const fade = document.getElementById('fade-overlay');
            const container = document.getElementById('app-container');
            
            e.target.style.pointerEvents = 'none';
            
            container.style.transition = 'transform 1s cubic-bezier(0.25, 1, 0.5, 1)';
            container.style.transform = 'scale(1.5)';
            fade.classList.add('active');
            
            await sleep(1000); 

            cancelAnimationFrame(animationFrameId);
            window.location.href = CONFIG.nextPageUrl;
        });

        document.getElementById('orb-btn').addEventListener('click', async () => {
            const entryContainer = document.getElementById('fullscreen-entry');
            entryContainer.style.pointerEvents = 'none'; 
            
            // Start background music immediately on user tap interaction
            const bgMusic = document.getElementById('bg-music');
            if (bgMusic && bgMusic.paused) {
                bgMusic.play().catch(err => console.warn("Audio autoplay blocked:", err));
            }
            
            try {
                const docEl = document.documentElement;
                if (docEl.requestFullscreen) {
                    await docEl.requestFullscreen();
                } else if (docEl.webkitRequestFullscreen) {
                    await docEl.webkitRequestFullscreen();
                }
            } catch (err) {
                // Silently continue if fullscreen API is blocked
            }

            entryContainer.classList.add('hidden');

            setTimeout(() => {
                entryContainer.style.display = 'none';
                if (!isStarted) {
                    initParticles();
                    animateCanvas();
                    playSequence();
                }
            }, 800);
        });

    </script>
</body>
</html>
